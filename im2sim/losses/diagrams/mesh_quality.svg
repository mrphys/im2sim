<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="t">
<title id="t">What each mesh quality loss measures, with a low-loss and a high-loss example</title>
<style>
text{font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:#0f172a}
.s{font-size:11.5px;fill:#475569}
.ms{font-family:"Roboto Mono",Menlo,Consolas,monospace;font-size:11px;fill:#334155}
.mb{font-family:"Roboto Mono",Menlo,Consolas,monospace;font-size:11.5px;font-weight:600}
.ok{font-size:11px;font-weight:600;fill:#047857}
.no{font-size:11px;font-weight:600;fill:#b91c1c}
.h{font-size:14px;font-weight:600}
.card{fill:#fff;stroke:#e2e8f0}
.e{stroke:#334155;stroke-width:1.4;fill:none}
.f{fill:#e0f2fe;stroke:#334155;stroke-width:1.4}
.fb{fill:#fee2e2;stroke:#b91c1c;stroke-width:1.4}
.v{fill:#334155}
.n{stroke:#2563eb;stroke-width:1.6}
</style>
<defs><marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="779" height="399" rx="10"/>
<text class="h" x="20" y="30">Mesh quality losses: what each one penalises</text>
<text class="mb" x="20" y="58">EdgeLengthDeviationLoss</text><text class="s" x="20" y="76">uneven edge lengths</text>
<text class="ok" x="20" y="96">lower loss</text><text class="no" x="20" y="206">higher loss</text>
<text class="ms" x="20" y="336">std(len) / mean(len)</text>
<text class="mb" x="210" y="58">AspectRatioLoss</text><text class="s" x="210" y="76">badly shaped tetrahedra</text>
<text class="ok" x="210" y="96">lower loss</text><text class="no" x="210" y="206">higher loss</text>
<text class="ms" x="210" y="336">max edge / mean edge</text>
<text class="mb" x="400" y="58">FaceNormalLoss</text><text class="s" x="400" y="76">faces that are not coplanar</text>
<text class="ok" x="400" y="96">lower loss</text><text class="no" x="400" y="206">higher loss</text>
<text class="ms" x="400" y="336">‖std of unit normals‖</text>
<text class="mb" x="590" y="58">InversionLoss</text><text class="s" x="590" y="76">flat or inverted tetrahedra</text>
<text class="ok" x="590" y="96">lower loss</text><text class="no" x="590" y="206">higher loss</text>
<text class="ms" x="590" y="336">mean(max(0, min_vol − V))</text>
<line x1="198" y1="44" x2="198" y2="344" stroke="#e2e8f0"/>
<line x1="388" y1="44" x2="388" y2="344" stroke="#e2e8f0"/>
<line x1="578" y1="44" x2="578" y2="344" stroke="#e2e8f0"/>
