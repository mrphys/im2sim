<circle class="v" cx="113.0" cy="156.0" r="2.5"/>
<circle class="v" cx="147.0" cy="156.0" r="2.5"/>
<polygon class="f" points="29.9,220.1 73.4,213.8 37.3,267.5"/>
<polygon class="f" points="73.4,213.8 104.6,218.2 82.3,263.7"/>
<polygon class="f" points="104.6,218.2 121.5,215.1 114.1,258.1"/>
<polygon class="f" points="121.5,215.1 159.4,227.7 136.4,260.7"/>
<polygon class="f" points="37.3,267.5 82.3,263.7 73.4,213.8"/>
<polygon class="f" points="82.3,263.7 114.1,258.1 104.6,218.2"/>
<polygon class="f" points="114.1,258.1 136.4,260.7 121.5,215.1"/>
<circle class="v" cx="29.9" cy="220.1" r="2.5"/>
<circle class="v" cx="73.4" cy="213.8" r="2.5"/>
<circle class="v" cx="104.6" cy="218.2" r="2.5"/>
<circle class="v" cx="121.5" cy="215.1" r="2.5"/>
<circle class="v" cx="159.4" cy="227.7" r="2.5"/>
<circle class="v" cx="37.3" cy="267.5" r="2.5"/>
<circle class="v" cx="82.3" cy="263.7" r="2.5"/>
<circle class="v" cx="114.1" cy="258.1" r="2.5"/>
<circle class="v" cx="136.4" cy="260.7" r="2.5"/>
