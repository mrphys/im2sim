<text class="s" x="400" y="180">side view of a cap: normals agree</text>
<text class="s" x="400" y="290">warped cap: normals spread out</text>
<polygon class="f" points="620,162 700,162 660,110"/>
<circle class="v" cx="620" cy="162" r="2.5"/><text class="ms" x="608" y="176">A</text>
<circle class="v" cx="700" cy="162" r="2.5"/><text class="ms" x="706" y="176">B</text>
<circle class="v" cx="660" cy="110" r="2.5"/><text class="ms" x="666" y="106">C</text>
<text class="s" x="712" y="134">V &gt; 0</text>
<polygon class="fb" points="620,222 700,222 660,272"/>
<circle class="v" cx="620" cy="222" r="2.5"/><text class="ms" x="608" y="236">A</text>
<circle class="v" cx="700" cy="222" r="2.5"/><text class="ms" x="706" y="236">B</text>
<circle class="v" cx="660" cy="272" r="2.5"/><text class="ms" x="668" y="276">C</text>
<text class="s" x="712" y="250" style="fill:#b91c1c">V &lt; 0</text>
<text class="s" x="590" y="290">C pushed through AB: the</text>
<text class="s" x="590" y="304">element is inside out (2D sketch)</text>
<text class="s" x="20" y="366">Supervised Edge, AspectRatio and FaceNormal losses compare against the target mesh; for the first two the loss is</text>
<text class="s" x="20" y="382">relu(pred − target)², so only being worse than the target is penalised. InversionLoss never uses a target.</text>
</svg>
