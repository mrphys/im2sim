<text class="s" x="328" y="144">ratio = 1</text>
<text class="s" x="210" y="290">a sliver: one edge far longer</text>
<text class="s" x="210" y="304">than the mean (2D stand-in)</text>
<polyline class="e" points="410,152 440,152 470,152 500,152 530,152 560,152"/>
<line class="n" x1="425.0" y1="152" x2="425.0" y2="124" marker-end="url(#n)"/>
