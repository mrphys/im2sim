<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" role="img" aria-labelledby="t">
<title id="t">Which mesh_ops function turns each part of a PyVista mesh into each attribute of a PyG Data object</title>
<style>
text{font-family:Roboto,"Helvetica Neue",Arial,sans-serif;font-size:13px;fill:#0f172a}
.s{font-size:11.5px;fill:#475569}
.m{font-family:"Roboto Mono",Menlo,Consolas,monospace;font-size:12px}
.ms{font-family:"Roboto Mono",Menlo,Consolas,monospace;font-size:11px;fill:#b45309}
.b{font-weight:600}
.h{font-size:14px;font-weight:600}
.card{fill:#fff;stroke:#e2e8f0}
.neu{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}
.gr{fill:#d1fae5;stroke:#047857;stroke-width:1.5}
.row{fill:#fff;stroke:#cbd5e1}
.ln{stroke:#475569;stroke-width:1.4;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect class="card" x="0.5" y="0.5" width="779" height="379" rx="10"/>
<text class="h" x="20" y="30">From a PyVista mesh to a PyG graph</text>
<rect class="neu" x="20" y="46" width="230" height="282" rx="8"/><text class="b" x="32" y="66">pv.read("mesh.vtu")</text>
<rect class="row" x="30" y="80" width="210" height="40" rx="4"/><text class="m" x="40" y="97">points</text><text class="s" x="40" y="113">[N, 3]</text>
<rect class="row" x="30" y="130" width="210" height="40" rx="4"/><text class="m" x="40" y="147">cells</text><text class="s" x="40" y="163">tets + boundary triangles</text>
<rect class="row" x="30" y="180" width="210" height="40" rx="4"/><text class="m" x="40" y="197">cell_data["CellEntityIds"]</text><text class="s" x="40" y="213">0 volume · 1 wall · 2 inlet · 3 outlet</text>
<rect class="row" x="30" y="276" width="210" height="40" rx="4"/><text class="m" x="40" y="293">point_data["pressure"], ...</text><text class="s" x="40" y="309">one scalar array per name</text>
<rect class="gr" x="530" y="46" width="230" height="282" rx="8"/><text class="b" x="542" y="66">Data()</text>
<rect class="row" x="540" y="80" width="210" height="38" rx="4"/><text class="m" x="550" y="96">coords</text><text class="s" x="550" y="111">[N, 3]</text>
<rect class="row" x="540" y="126" width="210" height="38" rx="4"/><text class="m" x="550" y="142">edge_index</text><text class="s" x="550" y="157">[2, E]</text>
<rect class="row" x="540" y="172" width="210" height="38" rx="4"/><text class="m" x="550" y="188">wall_index, ...</text><text class="s" x="550" y="203">node ids per structure</text>
<rect class="row" x="540" y="218" width="210" height="38" rx="4"/><text class="m" x="550" y="234">wall_cell_index, ...</text><text class="s" x="550" y="249">[3 or 4, M] cells per structure</text>
<rect class="row" x="540" y="284" width="210" height="38" rx="4"/><text class="m" x="550" y="300">cfd</text><text class="s" x="550" y="315">[N, F] features</text>
<path class="ln" d="M240 100 C390 100 380 99 538 99" marker-end="url(#a)"/>
<text class="ms" x="390" y="94" text-anchor="middle">torch.from_numpy(mesh.points)</text>
<path class="ln" d="M240 150 C390 150 380 145 538 145" marker-end="url(#a)"/>
<text class="ms" x="390" y="140" text-anchor="middle">get_edges_tet(mesh)</text>
<path class="ln" d="M240 196 C390 196 380 191 538 191" marker-end="url(#a)"/>
<text class="ms" x="390" y="186" text-anchor="middle">get_structure_ids(mesh, names)</text>
<path class="ln" d="M240 204 C390 204 380 237 538 237" marker-end="url(#a)"/>
<text class="ms" x="390" y="258" text-anchor="middle">get_structure_cells(mesh, names)</text>
<path class="ln" d="M240 296 C390 296 380 303 538 303" marker-end="url(#a)"/>
<text class="ms" x="390" y="292" text-anchor="middle">get_node_features(mesh, [...])</text>
<text class="s" x="20" y="350">names maps CellEntityIds to structure names, e.g. {1: "wall", 2: "inlet", 3: "outlet"}. The two structure</text>
<text class="s" x="20" y="365">functions return dicts; set_attrs(data, d) stores each entry on the Data object. get_edges_tet reads the cells with id 0.</text>
</svg>
