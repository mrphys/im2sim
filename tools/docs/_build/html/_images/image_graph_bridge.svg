<rect class="op" x="662" y="168" width="122" height="46" rx="6"/>
<text class="m" x="672" y="187">image[:, -1]</text>
<text class="s" x="672" y="204">← mask</text>
<text class="s" x="420" y="300">Voxel index = floor(coords / voxel_sizes). The mask replaces the</text>
<text class="s" x="420" y="315">last channel of the image it is given. FeatureRasterizer writes</text>
<text class="s" x="420" y="330">node features into the last channels instead of a 0/1 mask.</text>
