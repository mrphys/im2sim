<text class="s" x="280" y="102">[N, C]</text>
<text class="s" x="280" y="200">one row per node</text>
<text class="s" x="20" y="300">Each node takes a weighted mix of the 8 voxels around it</text>
<text class="s" x="20" y="315">(4 in this 2D slice). Coordinates are in input-image voxels and</text>
<text class="s" x="20" y="330">are rescaled by feature size / image_dim, so features from any</text>
<text class="s" x="20" y="345">encoder level can be sampled.</text>
